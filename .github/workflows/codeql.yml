# CodeQL — análisis estático de seguridad (SAST) para JavaScript/TypeScript (KAN-36)
# OWASP Top 10 2025 A03 Software Supply Chain Failures / seguridad de código.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # semanal, lunes 03:30 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Excluir archivos de test del análisis: sus mini-apps de prueba no son
          # superficie de ataque real (las rutas de producción sí están rate-limited).
          config: |
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
